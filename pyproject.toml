[project]
name = "taper"
version = "0.1.0"
description = "Narrowing-only capability tokens and a credential broker for AI agents"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = ["cryptography>=42"]

[project.optional-dependencies]
dev = ["pytest>=8"]
postgres = ["psycopg[binary]>=3.1"]

[project.scripts]
taper = "taper.cli:main"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.setuptools]
packages = ["taper", "taper.adapters"]
